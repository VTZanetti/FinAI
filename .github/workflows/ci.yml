name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:27
        options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FinAI.slnx

      - name: Build
        run: dotnet build FinAI.slnx --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/FinAI.UnitTests --no-build -c Release

      - name: Integration tests (Testcontainers)
        run: dotnet test tests/FinAI.IntegrationTests --no-build -c Release
        env:
          DOTNET_EnableWriteXorExecute: "0"

      - name: Format check
        run: dotnet format FinAI.slnx --verify-no-changes --no-restore
